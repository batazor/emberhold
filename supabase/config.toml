# Раскладка серверных функций (§6). Точка входа названа явно: CLI по умолчанию
# ищет `index.ts`, а у нас лежит сборка — `index.js`, склеенная из `src/sim`
# скриптом `npm run edge`. Писать функции прямо здесь нельзя: им нужен код
# симуляции, а он живёт в игре и обязан быть тем же самым.
project_id = "ynprsyzjdaheivhfcuel"

[functions.sortie]
entrypoint = "./functions/sortie/index.js"

[functions.wheel]
entrypoint = "./functions/wheel/index.js"

[functions.billing]
entrypoint = "./functions/billing/index.js"

# До Supabase-сессии личность подтверждает подпись Telegram initData.
[functions.telegram-auth]
entrypoint = "./functions/telegram-auth/index.js"
verify_jwt = false

# Telegram подписывает webhook собственным секретным заголовком.
[functions.telegram-webhook]
entrypoint = "./functions/telegram-webhook/index.js"
verify_jwt = false

# Stripe подписывает запрос сам; Supabase JWT у внешнего webhook нет.
[functions.stripe-webhook]
entrypoint = "./functions/stripe-webhook/index.js"
verify_jwt = false
